services:
  db:
    image: postgres:17
    container_name: n8n-db
    restart: unless-stopped
    environment:
      POSTGRES_DB: n8n
      POSTGRES_USER: n8n
      POSTGRES_PASSWORD_FILE: /run/secrets/db_password
    volumes:
      - db:/var/lib/postgresql/data
      - ./secrets/db_password:/run/secrets/db_password:ro
    networks: [interne]
  n8n:
    image: docker.n8n.io/n8nio/n8n:latest
    container_name: n8n
    restart: unless-stopped
    depends_on: [db]
    env_file: ./secrets/n8n.env
    environment:
      N8N_HOST: auto.e-delmotte.fr
      N8N_PROTOCOL: https
      N8N_PORT: "5678"
      WEBHOOK_URL: https://auto.e-delmotte.fr/
      N8N_PROXY_HOPS: "1"
      GENERIC_TIMEZONE: Europe/Paris
      TZ: Europe/Paris
      N8N_DIAGNOSTICS_ENABLED: "false"
      N8N_PERSONALIZATION_ENABLED: "false"
      N8N_VERSION_NOTIFICATIONS_ENABLED: "false"
      N8N_ENCRYPTION_KEY_FILE: /run/secrets/encryption_key
      DB_TYPE: postgresdb
      DB_POSTGRESDB_HOST: n8n-db
      DB_POSTGRESDB_DATABASE: n8n
      DB_POSTGRESDB_USER: n8n
      DB_POSTGRESDB_PASSWORD_FILE: /run/secrets/db_password
      N8N_BLOCK_ENV_ACCESS_IN_NODE: "false"
      EXECUTIONS_DATA_PRUNE: "true"
      EXECUTIONS_DATA_MAX_AGE: "720"
    volumes:
      - data:/home/node/.n8n
      - ./secrets/encryption_key:/run/secrets/encryption_key:ro
      - ./secrets/db_password_n8n:/run/secrets/db_password:ro
      - ./workflows:/import:ro
    networks: [interne, proxy]
volumes:
  db:
  data:
networks:
  interne:
  proxy:
    external: true
